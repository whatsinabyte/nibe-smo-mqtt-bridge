        note: 'Electricity price-zone selector, per Nibe''s VVM 320 manual (its own section 4.1.6, "area" field alongside the affect-heating/cooling/pool/hot-water
          settings above). Identifies which electricity market zone SPA should use for price data — set via myUplink rather
          than this register in normal use.

