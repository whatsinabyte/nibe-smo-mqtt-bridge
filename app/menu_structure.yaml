          range: °C
          point_id: 26711
          note: The value the controller uses for BT52 when the flag above is set.
        - label: External reading of BT50 activated
          range: off/on
          point_id: 29970
          note: Enables using an externally supplied value for BT50 (room sensor) instead of the physical sensor.
        - label: External reading of value BT50
          range: °C
          point_id: 29971
          note: The value the controller uses for BT50 when the flag above is set.
        - label: External reading of BT68 activated
          range: off/on
          point_id: 33193
          note: Enables using an externally supplied value for BT68 (flow line, additional heat) instead of the physical sensor.
        - label: External reading of value BT68
          range: °C
          point_id: 33194
          note: The value the controller uses for BT68 when the flag above is set.
        - label: External reading of BT69 activated
          range: off/on
          point_id: 33195
          note: Enables using an externally supplied value for BT69 (return line, additional heat) instead of the physical sensor.
        - label: External reading of value BT69
          range: °C
          point_id: 33196
          note: The firmware titles this "External reading of value BT68", the same as the point two Modbus registers
            below it. By its position it is BT69's value -- the activation and value registers run in pairs, Modbus
            6003/6004 for BT68 and 6005/6006 here, and Modbus 6005 is titled BT69. The label follows the pairing; the
            firmware title appears to be a mistake. (All four numbers here are Modbus registers, not point ids.)
    - id: 7.5.10
      title: Change pump model
      description: 'Select the model of circulation pump connected to the installation. SMO S40 uses the pump model to calculate
        the correct operating curve and speed control parameters. The standard charge pump for SMO S40 is the CPD 12-25/75
        (part no. 141 051).

        '
      note: 'The pump model selector for the main heat pump (EB101) is controller-display-only, with no API-accessible
        register. In a multi-heat-pump cascade installation, the same selector for each additional heat pump does have
        an accessible register — see the settings below.

        '
      settings:
      - label: Pump model (EB103/104)
        range: off/on
        point_id: 4951
        note: Pump model selector for heat pump 2 in a multi-heat-pump cascade installation.
      - label: Pump model (EB105/106)
        range: off/on
        point_id: 4952
        note: Pump model selector for heat pump 3 in a multi-heat-pump cascade installation.
      - label: Pump model (EB107/108)
        range: off/on
        point_id: 4953
        note: Pump model selector for heat pump 4 in a multi-heat-pump cascade installation.
    - id: 7.5.13
      title: Third-party integration
      description: 'Settings for third-party energy management integrations via Modbus, including Solar PV offset control.
        All registers are in menu 7.2.19 External energy meter. Cross-reference: menu 7.2.19.

        '
      settings: []
      local_api: false
      submenus:
      - id: 7.5.13.1
        title: Modbus TCP/IP ext.
        description: 'Activates Modbus TCP/IP for external services. The register named "Modbus TCP/IP Ext." in this
          firmware carries a "(Solar PV)" qualifier and is mapped in menu 7.5.12, where it activates the interface for a
          PV inverter specifically.

          '
        settings:
        - label: Modbus TCP/IP ext.
          range: off/on
          point_id: null
          note: Activates Modbus TCP/IP for external services.
      - id: 7.5.13.2
        title: EEBUS
        description: 'Activates EEBUS communication. No register is exposed for it.

          '
        settings:
        - label: EEBUS
          range: off/on
          point_id: null
          note: Activates EEBUS communication.
    - id: 7.5.12
      title: Modbus TCP/IP PV inverter
      description: Configure Modbus TCP/IP connection to Solar PV inverter.
      settings:
      - label: Modbus TCP/IP external Solar PV activated
        range: off/on
        point_id: 14312
        tip: 'Enable Modbus TCP/IP connection to Solar PV inverter for excess power management. Requires compatible inverter
          and network configuration.

          '
      - label: Include own consumption
        range: off/on
        point_id: 14313
        note: 'When enabled, own consumption is subtracted from total PV production to calculate available excess power.

          '
      - label: Available power
        range: 0 – 65535 W
        point_id: 14314
        note: Read-only — the available PV power currently being reported to the SMO S40 via Modbus TCP from the Solar PV
          inverter. Any value written here will be overwritten within seconds.
    - id: 7.5.15
      title: Local REST API
      description: 'Enable/disable the local REST API used by this bridge and other local integrations. The REST API runs
        on HTTPS port 8443. Requires firmware 4.10.5 or later.

        '
      local_api: false
      note: 'Local REST API enable/disable is configured on the controller display only.

        '
      settings: []
  - id: '7.6'
    title: Factory setting service
    description: 'Reset all settings including user settings to factory values. It is also possible to factory reset the connected
      heat pumps.

      '
    warning: 'When resetting, the start guide is displayed the next time SMO S40 restarts. All settings will be lost including
      installer settings. Use menu 4.30.4 if you only want to reset user settings.

      '
    settings: []
    local_api: false
  - id: '7.7'
    title: Start guide
    description: 'When SMO S40 is started for the first time the start guide is automatically activated. From this menu you
      can start it manually for reconfiguration during commissioning or after a factory reset.

      '
    settings:
    - label: Start guide has been run
      range: off/on (read-only)
      point_id: 9028
      note: Whether the initial commissioning start guide has been completed.
  - id: '7.8'
    title: Quick start
    description: 'Quick start the compressors. One of the following demands must exist: heating, hot water, cooling, or pool
      (pool accessory required).

      '
    warning: 'Too many quick starts in a short space of time may damage the compressors and their auxiliary equipment.

      '
    note: 'On the SVM S332 (split system with an outdoor unit): for a quick start to be possible, the compressor must
      first have reached the correct temperature, which can take up to 30 minutes of preheating.

      '
    settings: []
    local_api: false
  - id: '7.9'
    title: Logs
    description: 'System logs for diagnosing faults and reviewing historical events.

      '
    submenus:
    - id: 7.9.1
      title: Change log
      description: 'Read off previous changes to the control system here. The change log is saved at restart and remains unchanged
        after a factory reset.

        '
      note: 'The bridge maintains its own change log via MQTT (nibe/browser/changelog/history) which covers all changes made
        through both the controller display and HA. The controller display change log is separate and display-only.

        '
      settings: []
      local_api: false
    - id: 7.9.2
      title: Extended alarm log
      description: 'Detailed alarm log intended for troubleshooting. Contains extended diagnostic information for each alarm
        event.

        '
      settings: []
      local_api: false
    - id: 7.9.3
      title: Black box
      description: 'Export all logs (Change log, Extended alarm log) to a USB memory. Connect a USB memory and select the
        log(s) to export. Contains high-frequency data captured at the moment of an alarm — compressor speed, temperatures,
        pressures and other key parameters in the seconds before and after a fault.

        '
      settings: []
      local_api: false
