        description: 'Lets a third-party system supply temperature values over Modbus TCP/IP in place of a physical sensor.
          Each sensor has an activation flag and a value register; with the flag set, the controller uses the injected
          value instead of its own input.


          Documented only in the firmware changelog, never in the installer manual. Version 2.21.12 (2023-08-30) added the
          function and identified each sensor by its Modbus holding register -- BT1 at Modbus 5217, BT25 at 5218, BT71 at
          5219, BT5 at 5220, BT6 at 5221, BT7 at 5222 and BT52 at 5225 -- stating they are "activated in menu 7.5.9.2".
          BT50 followed later, with the same activation route.


          Those are Modbus register numbers, not REST API point ids -- the two numbering schemes are unrelated.


          That changelog entry also lists BT51 pool 1 and pool 2, at Modbus 5223 and 5224. Their REST API point ids are
          only known on an installation with a pool connected -- both are listed below without a point id so the function
          is still documented.


          Most of these registers report as read-only despite the function being about writing values, and the activation
          flags are writable for only some sensors. That inconsistency is the firmware''s own.

          '
