    - id: 7.2.6
      title: Step-controlled additional heat (AXC)
      description: 'Settings for step-controlled additional heat — typically an external electric boiler with multiple power
        steps. As with menu 7.2.3, the Nibe menu system places this under the AXC 30 docking menu when AXC 30 is installed,
        but the underlying register is shared with the built-in step control in menu 7.1.5.1 — it is not AXC-specific. The
        DM start value sets when the first additional heat step engages relative to the normal DM start compressor value.

        '
      settings:
      - label: Max step, internal additional heat
        range: 0 – 7
        point_id: 14968
        note: Same register as menu 7.1.5.1 — see there for full context.
    - id: 7.2.8
      title: Hot water comfort (AXC)
      description: 'Settings for hot water comfort functionality. Enables an immersion heater or mixing valve to maintain
        or boost domestic hot water temperature. "Activating immersion heater" allows the immersion heater to run during hot
        water production. "Activating mixing valve" enables a shunt valve to boost outgoing hot water temperature.

        Cross-reference: hot water demand mode → menu 2.2; hot water circulation → menu 2.5.

        '
      settings:
      - label: Hot water comfort mode
        range: off/on
        point_id: 4560
        note: Activates hot water comfort heating via the AXC 30 accessory.
      - label: HW comfort shunt on/off
        range: off/on
        point_id: 4576
        note: Enables hot water comfort shunt circuit via AXC 30 accessory.
      - label: Operating mode, HW comfort shunt (read-only)
        range: Status
        point_id: 2038
        note: Live operating status of the hot water comfort shunt circuit.
      - label: HW comfort additional heat
        range: off/on
        point_id: 4582
        note: Permits additional heat for hot water comfort mode via AXC 30.
      - label: Operating mode, HW comfort additional heat (read-only)
        range: Status
        point_id: 2039
        note: Live operating status of hot water comfort additional heat.
      - label: Outgoing hot water (BT70, read-only)
        range: °C
        point_id: 116
      - label: Hot water comfort return (BT82, read-only)
        range: °C
        point_id: 533
      - label: Hot water comfort heater (BT83, read-only)
        range: °C
        point_id: 534
    - id: 7.2.17
      title: Pool heating (POOL 40 / AXC 30)
      description: 'Pool heating settings for the POOL 40 accessory (part no. 067 062) or AXC 30 accessory card (part no.
        067 304) with pool connection. Pool heating uses the heat pump''s charge pump to circulate heating medium through
        the pool heat exchanger.

        '
      settings:
      - label: Pool 1 accessory
        range: off/on
        point_id: 4538
        tip: 'Activate pool 1 heating accessory. Pool heating uses surplus heat pump capacity and has lowest priority.

          '
      - label: Pool 2 accessory
        range: off/on
        point_id: 4537
        note: Same as pool 1 above — uses surplus heat pump capacity and has lowest priority.
      - label: Pool influence (Smart Price Adaption)
        range: 0 – 10
        point_id: 4794
        tip: Controls how strongly the Smart Price Adaption affects pool heating. "Off" disables SPA influence on the pool
          circuit. "Saving" and "Saving PLUS" progressively reduce pool heating during high-price periods.
      - label: Pool offset (Smart Price Adaption, read-only)
        range: °C
        point_id: 3282
        note: Live temperature offset currently applied to pool heating by Smart Price Adaption.
      - label: Temperature overcharging pool
        range: 1 – 50 °C
        point_id: 14062
        note: Extra temperature above pool setpoint added at end of charge cycle.
      - label: Pool temperature sensor CL12-BT51 (read-only)
        range: °C
        point_id: 78
        note: Current pool water temperature measured at BT51. Read-only status.
      - label: Pool 1 valve QN19 (read-only)
        range: Status
        point_id: 2046
        note: Status of pool 1 diverter valve QN19. ON means the valve has diverted flow toward the pool heat exchanger.
      - label: Pool 2 valve QN19 (read-only)
        range: Status
        point_id: 2045
        note: Status of pool 2 diverter valve QN19. ON means the valve has diverted flow toward the pool 2 heat exchanger.
      - label: Pool 1 pump status (read-only)
        range: Status
        point_id: 3144
        note: Status of pool 1 circulation pump. ON means the pump is running.
      - label: Pool 2 pump status (read-only)
        range: Status
        point_id: 3143
        note: Status of pool 2 circulation pump. ON means the pump is running.
      - label: Pool 1 blocked (read-only)
        range: Status
        point_id: 2043
        note: Live status of a block on pool 1 heating.
      - label: Pool 2 blocked (read-only)
        range: Status
        point_id: 2042
        note: Live status of a block on pool 2 heating.
      note: 'Pool start/stop temperature and compressor count settings require POOL 40 (part no. 067 062) or AXC 30 (part
        no. 067 304) accessory.

        '
    - id: 7.2.19
      title: External energy meter
      description: 'Configuration for an external energy meter connected via Modbus or pulse input. Used for Solar PV integration
        and Smart Energy Source control. Cross-reference: Smart Energy Source prioritisation that uses the metered solar data
        → menu 4.6; the control method (price vs CO2) that determines how solar surplus is used → menu 4.6 Smart Energy Source.

        '
      settings:
      - label: Mode, energy meter (BE6)
        range: 0 – 255
        point_id: 6154
        note: Operating mode for electricity meter BE6.
      - label: Mode, energy meter (BE7)
        range: 0 – 255
        point_id: 6155
        note: Operating mode for electricity meter BE7.
      - label: Mode, energy meter (BE11)
        range: 0 – 255
        point_id: 6477
        note: Operating mode for electricity meter BE11.
      note: 'Energy per pulse and pulses per kWh settings are configured on the controller display only — not exposed via
        the local API. "Pulses per kWh" is set and presented in whole numbers; if a higher resolution is required, use
        "Energy per pulse" instead.

        '
    - id: 7.2.20
      title: Groundwater pump
      description: Groundwater pump accessory settings. Requires groundwater pump accessory. An open-loop groundwater
        well is an alternative heat source, not a controller family — it applies to an SMO S40 as well as ground/water
        models, and the firmware changelog documents this menu for SMO S40 directly, both standalone and when paired
        with a ground-source heat pump in a multi-installation.
      settings:
      - label: Ground water pump accessory
        range: off/on
        point_id: 3891
        note: For an open-loop groundwater well source, as opposed to a closed-loop brine/ground collector.
      - label: Ground water pump temperature alarm
        range: off/on
        point_id: 5479
        tip: 'Enable temperature alarm for groundwater pump. Fires if water temperature drops below the alarm level.

          '
      - label: Ground water pump temperature alarm level
        range: -15 – 20 °C
        point_id: 5480
        note: 'Temperature threshold that triggers the groundwater temperature alarm.

          '
      - label: Operating mode, groundwater pump (read-only)
        range: Status
        point_id: 3151
        note: Live operating status of the groundwater pump.
    - id: 7.2.11
      title: Vent. heat exchanger (ERS)
      description: 'Settings for the ERS ventilation heat exchanger accessory, which recovers energy from the extract air.
        Fan speeds and the bypass temperature are set in menu 1.2.1, menu 7.1.4.1 and menu 7.1.4.4; this menu holds the per-unit
        settings documented for ERS in its own installer manuals.


        The firmware exposes these registers unevenly: the lowest extract air temperature exists only for ERS 5-8 and the
        blocking action only for ERS 3-8, with no equivalent register for the lower-numbered units. That asymmetry is
        NIBE''s own, not an omission here.

        '
      note: 'Physical configuration, Allow re-heater, Offset re-heater and Desired supply air temp. below all require
        an ERS unit connected and are not exposed via the local API otherwise. The four "Lowest extract air temp." settings
        (ERS 5-8) share one behaviour: below this extract air temperature the unit stops recovering, protecting the heat
        exchanger from freezing. The six "Blocking action" settings (ERS 3-8) share another: what the unit does when its
        external blocking input is active.

        '
      settings:
      - label: Physical configuration
        range: Left / Right
        point_id: null
