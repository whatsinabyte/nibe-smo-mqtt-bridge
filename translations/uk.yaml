configuration:
  nibe_host:
    name: IP-адреса контролера
    description: >-
      IP-адреса або ім'я хоста контролера Nibe серії S у локальній мережі.
      Наполегливо рекомендується призначити статичну IP-адресу в
      маршрутизаторі.
  nibe_port:
    name: Порт API контролера
    description: >-
      HTTPS-порт локального REST API контролера. Типове значення 8443
      підходить для всіх продуктів серії S, і зазвичай його не потрібно
      змінювати.
  nibe_username:
    name: Ім'я користувача API контролера
    description: >-
      Ім'я користувача, задане в сервісному меню контролера (меню 7.5.15).
      Має точно збігатися зі значенням, налаштованим у контролері.
  nibe_password:
    name: Пароль API контролера
    description: >-
      Пароль, заданий у сервісному меню контролера (меню 7.5.15). З
      урахуванням регістру.
  mqtt_host:
    name: Ім'я хоста MQTT-брокера
    description: >-
      Ім'я хоста або IP-адреса MQTT-брокера. Типове значення
      "core-mosquitto" працює з офіційним доповненням Mosquitto. Для
      будь-якого іншого брокера вкажіть IP-адресу або ім'я хоста.
  mqtt_port:
    name: Порт MQTT-брокера
    description: >-
      TCP-порт MQTT-брокера. Типове значення 1883 — стандартний
      незашифрований порт MQTT. Якщо нижче увімкнено "MQTT TLS", змініть
      його на 8883 (стандартний зашифрований порт MQTT, який використовує
      Mosquitto).
  mqtt_username:
    name: Ім'я користувача MQTT
    description: >-
      Ім'я користувача для автентифікації на MQTT-брокері. Залиште порожнім,
      якщо брокер не вимагає автентифікації.
      За типового значення "core-mosquitto" Supervisor надає обліковий запис доповнення Mosquitto, який має пріоритет над цим полем.
  mqtt_password:
    name: Пароль MQTT
    description: >-
      Пароль для автентифікації на MQTT-брокері. Залиште порожнім, якщо
      брокер не вимагає автентифікації.
      За типового значення "core-mosquitto" Supervisor надає обліковий запис доповнення Mosquitto, який має пріоритет над цим полем.
  device_name:
    name: Назва пристрою
    description: >-
      Як контролер відображається як пристрій у Home Assistant. Типово
      "Nibe SMO S40", але можна вказати назву вашого обладнання (наприклад,
      "Nibe S1155" або "Nibe VVM S320").
  language:
    name: Мова
    description: >-
      Мова назв і описів об'єктів, які повертає REST API контролера. "auto"
      (типово) відповідає мові, налаштованій у Home Assistant; виберіть
      конкретну мову, щоб її перевизначити. Список відповідає власному меню
      "Мова" контролера — через REST API безпосередньо підтверджено лише
      деякі пункти, але вибір непідтримуваної мови безпечний: без помилки
      використовується англійська. Не перекладає панель Nibe Menus, вміст
      якої фіксований і англійською. Після зміни потрібен перезапуск.
  poll_interval:
    name: Інтервал опитування
    description: >-
      Як часто зчитуються всі точки даних контролера, у секундах.
      Рекомендовано 30 секунд. Контролер — вбудований пристрій: його REST API
      другорядний щодо основного завдання — керування тепловим насосом.
      Після зміни потрібен перезапуск.
  mode:
    name: Режим об'єктів
    description: >-
      Який набір об'єктів публікує міст: "essential" охоплює основні
      температури, стан гарячої води, підсумки енергії та основні уставки —
      гарна відправна точка для будь-якої установки. "monitoring" додає
      подачу/зворотку, стан компресора та показники ефективності.
      "advanced" додає весь холодильний контур і регістри налаштування.
      "menus" публікує всі точки, потрібні для панелі Nibe Menus, і будує цю
      панель. "all" публікує всі знайдені точки; "none" нічого не публікує,
      доки ви не ввімкнете об'єкти вручну. Застосовується під час запуску —
      зміна потребує перезапуску доповнення, а перехід на інший режим типово
      вимикає об'єкти, що не входять до нового набору, — об'єкти, увімкнені
      вручну через картку Entity Manager, також видаляються під час зміни
      режиму, але зберігаються під час перезапусків із тим самим режимом.
      Щоб це змінити, див. нижче "Поведінка під час зміни режиму".
      "essential" — рекомендована відправна точка.
  mode_switch_behavior:
    name: Поведінка під час зміни режиму
    description: >-
      Що відбувається з уже ввімкненими об'єктами під час переходу на інший
      режим. "replace" (типово) приводить увімкнений набір точно у
      відповідність до точок нового режиму — усе, що ввімкнено зараз і не
      входить до нового режиму, зокрема об'єкти, увімкнені вручну через
      картку Entity Manager, вимикається. "merge" лише додає точки нового
      режиму до вже ввімкнених — зміна режиму ніколи нічого не вимикає. Діє
      під час кожної зміни режиму. Не впливає на нову установку чи
      перезапуск із тим самим режимом — спрацьовує лише за фактичної зміни
      режиму.
  log_level:
    name: Рівень журналу
    description: >-
      Докладність лише журналу доповнення — не впливає на те, які об'єкти
      відображаються. Для звичайної роботи рекомендовано "info".
      Використовуйте "debug" для діагностики проблем із підключенням або
      об'єктами — він створює великий обсяг виводу, тож потім його слід
      повернути на "info". Щоб показати кнопку набору тестів і датчик
      результату, використовуйте натомість "Режим налагодження" нижче.
  debug_mode:
    name: Режим налагодження
    description: >-
      Вмикає кнопку набору тестів, кнопку очищення динамічної карти та
      датчик результату на пристрої Management. Не залежить від "Рівня
      журналу" вище — це єдине налаштування, що визначає, чи відображаються
      ці об'єкти. Набуває чинності під час наступного перезапуску
      доповнення: вимкнення також видаляє об'єкти, а не лише припиняє
      додавання нових.
  api_failure_threshold:
    name: Поріг помилок API
    description: >-
      Кількість невдалих опитувань поспіль, після якої у дзвіночку сповіщень
      HA з'являється постійне сповіщення. Типове значення 3 означає три
      помилки поспіль (90 секунд за типового інтервалу) до сповіщення.
      Збільште його в нестабільній мережі, щоб уникнути хибних тривог.
  changelog_retention_days:
    name: Зберігання журналу змін (дні)
    description: >-
      Скільки днів зберігаються записи журналу змін Entity Manager перед
      видаленням. Старіші записи видаляються під час кожного перезапуску
      моста. Типові 90 днів підходять для більшості установок.
  remove_frontend:
    name: Видалити інтерфейс під час зупинки
    description: >-
      Установіть true перед зупинкою доповнення, щоб під час наступного
      штатного завершення автоматично видалити панель Nibe Bridge, реєстрацію
      ресурсу Lovelace, файл картки та всі збережені MQTT-повідомлення.
      Використовуйте лише під час видалення. Звичайні перезапуски не
      зачіпаються. Повну процедуру видалення див. у документації.
  nibe_ca_cert:
    name: Шлях до CA-сертифіката контролера Nibe
    description: >-
      Необов'язково. Абсолютний шлях до файлу CA-сертифіката у форматі PEM
      для перевірки HTTPS-сертифіката контролера Nibe. Якщо задано, для всіх
      API-запитів до контролера вмикається повна перевірка ланцюжка TLS та
      імені хоста. Залиште порожнім, щоб приймати вбудований самопідписаний
      сертифікат контролера без перевірки — це типове значення, прийнятне в
      довіреній домашній мережі, але атака "людина посередині" в локальній
      мережі могла б перехопити трафік контролера.
      Приклад: /ssl/nibe-ca.pem
  mqtt_tls:
    name: MQTT TLS
    description: >-
      Вмикає шифрування TLS для всього трафіку між мостом і MQTT-брокером.
      Захищає облікові дані MQTT і всі команди об'єктів від читання іншими
      пристроями локальної мережі. Потребує брокера, налаштованого для TLS —
      якщо використовуєте доповнення Mosquitto, змініть "Порт MQTT-брокера"
      на 8883. Типово вимкнено.
  mqtt_ca_cert:
    name: Шлях до CA-сертифіката MQTT-брокера
    description: >-
      Необов'язково. Використовується лише за ввімкненого "MQTT TLS".
      Абсолютний шлях до файлу CA-сертифіката у форматі PEM для перевірки
      TLS-сертифіката брокера. Залиште порожнім, щоб використовувати
      системне сховище CA — це підходить для брокерів із сертифікатом,
      підписаним публічним центром сертифікації. Укажіть його, якщо брокер
      використовує самопідписаний або приватно підписаний сертифікат.
      Приклад: /ssl/mqtt-ca.pem
