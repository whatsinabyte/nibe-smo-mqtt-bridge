configuration:
  nibe_host:
    name: IP-адрес контроллера
    description: >-
      IP-адрес или имя хоста контроллера Nibe серии S в локальной сети.
      Настоятельно рекомендуется назначить статический IP-адрес в
      маршрутизаторе.
  nibe_port:
    name: Порт API контроллера
    description: >-
      HTTPS-порт локального REST API контроллера. Значение по умолчанию 8443
      подходит для всех продуктов серии S, и обычно его не нужно менять.
  nibe_username:
    name: Имя пользователя API контроллера
    description: >-
      Имя пользователя, заданное в сервисном меню контроллера (меню 7.5.15).
      Должно в точности совпадать со значением, настроенным в контроллере.
  nibe_password:
    name: Пароль API контроллера
    description: >-
      Пароль, заданный в сервисном меню контроллера (меню 7.5.15). С учётом
      регистра.
  mqtt_host:
    name: Имя хоста MQTT-брокера
    description: >-
      Имя хоста или IP-адрес MQTT-брокера. Значение по умолчанию
      "core-mosquitto" работает с официальным дополнением Mosquitto. Для
      любого другого брокера укажите IP-адрес или имя хоста.
  mqtt_port:
    name: Порт MQTT-брокера
    description: >-
      TCP-порт MQTT-брокера. Значение по умолчанию 1883 — стандартный
      незашифрованный порт MQTT. Если ниже включён "MQTT TLS", измените его
      на 8883 (стандартный зашифрованный порт MQTT, используемый Mosquitto).
  mqtt_username:
    name: Имя пользователя MQTT
    description: >-
      Имя пользователя для аутентификации на MQTT-брокере. Оставьте пустым,
      если брокер не требует аутентификации.
      При значении по умолчанию "core-mosquitto" Supervisor предоставляет учётную запись дополнения Mosquitto, которая имеет приоритет над этим полем.
  mqtt_password:
    name: Пароль MQTT
    description: >-
      Пароль для аутентификации на MQTT-брокере. Оставьте пустым, если
      брокер не требует аутентификации.
      При значении по умолчанию "core-mosquitto" Supervisor предоставляет учётную запись дополнения Mosquitto, которая имеет приоритет над этим полем.
  device_name:
    name: Имя устройства
    description: >-
      Как контроллер отображается в Home Assistant как устройство. По
      умолчанию "Nibe SMO S40", но можно указать название вашего
      оборудования (например, "Nibe S1155" или "Nibe VVM S320").
  language:
    name: Язык
    description: >-
      Язык названий и описаний объектов, которые возвращает REST API
      контроллера. "auto" (по умолчанию) следует языку, настроенному в Home
      Assistant; выберите конкретный язык, чтобы его переопределить. Список
      повторяет меню "Язык" самого контроллера — через REST API напрямую
      подтверждены лишь некоторые пункты, но выбор неподдерживаемого языка
      безопасен: без ошибки используется английский. Не переводит панель
      Nibe Menus, содержимое которой фиксировано и на английском. После
      изменения требуется перезапуск.
  poll_interval:
    name: Интервал опроса
    description: >-
      Как часто считываются все точки данных контроллера, в секундах.
      Рекомендуется 30 секунд. Контроллер — встраиваемое устройство: его
      REST API вторичен по отношению к основной задаче — управлению тепловым
      насосом. После изменения требуется перезапуск.
  mode:
    name: Режим объектов
    description: >-
      Какой набор объектов публикует мост: "essential" охватывает основные
      температуры, состояние горячей воды, итоги энергии и основные уставки —
      хорошая отправная точка для любой установки. "monitoring" добавляет
      подачу/обратку, состояние компрессора и показатели эффективности.
      "advanced" добавляет весь холодильный контур и регистры настройки.
      "menus" публикует все точки, нужные для панели Nibe Menus, и строит эту
      панель. "all" публикует все найденные точки; "none" ничего не
      публикует, пока вы не включите объекты вручную. Применяется при запуске
      — изменение требует перезапуска дополнения, а переход на другой режим
      по умолчанию отключает объекты, не входящие в новый набор, — объекты,
      включённые вручную через карточку Entity Manager, также удаляются при
      смене режима, но сохраняются при перезапусках с тем же режимом. См.
      ниже "Поведение при смене режима", чтобы это изменить.
      "essential" — рекомендуемая отправная точка.
  mode_switch_behavior:
    name: Поведение при смене режима
    description: >-
      Что происходит с уже включёнными объектами при переходе на другой
      режим. "replace" (по умолчанию) приводит включённый набор в точное
      соответствие с точками нового режима — всё, что включено сейчас и не
      входит в новый режим, включая объекты, включённые вручную через
      карточку Entity Manager, отключается. "merge" только добавляет точки
      нового режима к уже включённым — смена режима никогда ничего не
      отключает. Действует при каждой смене режима. Не влияет на новую
      установку и на перезапуск с тем же режимом — срабатывает только при
      фактической смене режима.
  log_level:
    name: Уровень журнала
    description: >-
      Подробность только журнала дополнения — не влияет на то, какие объекты
      отображаются. Для обычной работы рекомендуется "info". Используйте
      "debug" для диагностики проблем с подключением или объектами — он
      создаёт большой объём вывода, после чего его следует вернуть на
      "info". Чтобы показать кнопку набора тестов и датчик результата,
      используйте вместо этого "Режим отладки" ниже.
  debug_mode:
    name: Режим отладки
    description: >-
      Включает кнопку набора тестов, кнопку очистки динамической карты и
      датчик результата на устройстве Management. Не зависит от "Уровня
      журнала" выше — это единственная настройка, определяющая, отображаются
      ли эти объекты. Вступает в силу при следующем перезапуске дополнения:
      выключение также удаляет объекты, а не только прекращает добавление
      новых.
  api_failure_threshold:
    name: Порог ошибок API
    description: >-
      Число неудачных опросов подряд, после которого в колокольчике
      уведомлений HA появляется постоянное уведомление. Значение по
      умолчанию 3 означает три ошибки подряд (90 секунд при интервале по
      умолчанию) до оповещения. Увеличьте его в нестабильной сети, чтобы
      избежать ложных срабатываний.
  changelog_retention_days:
    name: Хранение журнала изменений (дни)
    description: >-
      Сколько дней хранятся записи журнала изменений Entity Manager перед
      удалением. Более старые записи удаляются при каждом перезапуске моста.
      Значение по умолчанию 90 дней подходит для большинства установок.
  remove_frontend:
    name: Удалить интерфейс при остановке
    description: >-
      Установите true перед остановкой дополнения, чтобы при следующем
      штатном завершении автоматически удалить панель Nibe Bridge,
      регистрацию ресурса Lovelace, файл карточки и все сохранённые
      MQTT-сообщения. Используйте только при удалении. Обычные перезапуски не
      затрагиваются. Полную процедуру удаления см. в документации.
  nibe_ca_cert:
    name: Путь к CA-сертификату контроллера Nibe
    description: >-
      Необязательно. Абсолютный путь к файлу CA-сертификата в формате PEM для
      проверки HTTPS-сертификата контроллера Nibe. Если задан, для всех
      API-запросов к контроллеру включается полная проверка цепочки TLS и
      имени хоста. Оставьте пустым, чтобы принимать встроенный
      самоподписанный сертификат контроллера без проверки — это значение по
      умолчанию, допустимое в доверенной домашней сети, но атака
      "человек посередине" в локальной сети могла бы перехватить трафик
      контроллера.
      Пример: /ssl/nibe-ca.pem
  mqtt_tls:
    name: MQTT TLS
    description: >-
      Включает шифрование TLS для всего трафика между мостом и MQTT-брокером.
      Защищает учётные данные MQTT и все команды объектов от чтения другими
      устройствами локальной сети. Требует брокера, настроенного для TLS —
      при использовании дополнения Mosquitto измените "Порт MQTT-брокера" на
      8883. По умолчанию выключено.
  mqtt_ca_cert:
    name: Путь к CA-сертификату MQTT-брокера
    description: >-
      Необязательно. Используется только при включённом "MQTT TLS".
      Абсолютный путь к файлу CA-сертификата в формате PEM для проверки
      TLS-сертификата брокера. Оставьте пустым, чтобы использовать системное
      хранилище CA — это подходит для брокеров с сертификатом, подписанным
      публичным центром сертификации. Укажите его, если брокер использует
      самоподписанный или частно подписанный сертификат.
      Пример: /ssl/mqtt-ca.pem
