configuration:
  nibe_host:
    name: IP адрес на контролера
    description: >-
      IP адрес или име на хоста на контролера Nibe от серия S в локалната
      мрежа. Силно се препоръчва в рутера да се зададе статичен IP адрес.
  nibe_port:
    name: Порт на API на контролера
    description: >-
      HTTPS порт на локалния REST API на контролера. Стойността по
      подразбиране 8443 е вярна за всички продукти от серия S и обикновено
      не е нужно да се променя.
  nibe_username:
    name: Потребителско име за API на контролера
    description: >-
      Потребителското име, зададено в сервизното меню на контролера (меню
      7.5.15). Трябва да съвпада точно със стойността в контролера.
  nibe_password:
    name: Парола за API на контролера
    description: >-
      Паролата, зададена в сервизното меню на контролера (меню 7.5.15).
      Различава главни и малки букви.
  mqtt_host:
    name: Име на хоста на MQTT брокера
    description: >-
      Име на хоста или IP адрес на MQTT брокера. Стойността по подразбиране
      "core-mosquitto" работи с официалната добавка Mosquitto. За друг
      брокер въведете IP адрес или име на хост.
  mqtt_port:
    name: Порт на MQTT брокера
    description: >-
      TCP порт на MQTT брокера. Стойността по подразбиране 1883 е
      стандартният некриптиран MQTT порт. Ако по-долу включите "MQTT TLS",
      сменете го на 8883 (стандартният криптиран MQTT порт, използван от
      Mosquitto).
  mqtt_username:
    name: Потребителско име за MQTT
    description: >-
      Потребителско име за удостоверяване пред MQTT брокера. Оставете
      празно, ако брокерът не изисква удостоверяване.
      При стойност по подразбиране "core-mosquitto" Supervisor предоставя акаунта на добавката Mosquitto, който има предимство пред това поле.
  mqtt_password:
    name: Парола за MQTT
    description: >-
      Парола за удостоверяване пред MQTT брокера. Оставете празно, ако
      брокерът не изисква удостоверяване.
      При стойност по подразбиране "core-mosquitto" Supervisor предоставя акаунта на добавката Mosquitto, който има предимство пред това поле.
  device_name:
    name: Име на устройството
    description: >-
      Как контролерът се показва като устройство в Home Assistant. По
      подразбиране "Nibe SMO S40", но можете да го съобразите с реалното си
      оборудване (напр. "Nibe S1155" или "Nibe VVM S320").
  language:
    name: Език
    description: >-
      Език на имената и описанията на обектите, връщани от REST API на
      контролера. "auto" (по подразбиране) следва езика, зададен в Home
      Assistant; изберете конкретен език, за да го замените. Списъкът следва
      собственото меню "Език" на контролера — чрез REST API пряко са
      потвърдени само някои записи, но изборът на неподдържан език е
      безвреден: без грешка се използва английски. Не превежда таблото Nibe
      Menus, чието съдържание е фиксирано и на английски. След промяна е
      необходимо рестартиране.
  poll_interval:
    name: Интервал на запитване
    description: >-
      Колко често се четат всички точки с данни от контролера, в секунди.
      Препоръчват се 30 секунди. Контролерът е вградено устройство —
      неговият REST API е второстепенен спрямо основната му задача,
      управлението на термопомпата. След промяна е необходимо рестартиране.
  mode:
    name: Режим на обектите
    description: >-
      Какъв набор от обекти публикува мостът: "essential" обхваща основните
      температури, състоянието на топлата вода, сборовете енергия и
      основните зададени стойности — добра отправна точка за всяка
      инсталация. "monitoring" добавя подаване/връщане, състоянието на
      компресора и показателите за ефективност. "advanced" добавя целия
      хладилен кръг и регистрите за настройка. "menus" публикува всички
      точки, нужни за таблото Nibe Menus, и изгражда това табло. "all"
      публикува всички открити точки; "none" не публикува нищо, докато не
      включите обекти ръчно. Прилага се при стартиране — промяната изисква
      рестартиране на добавката, а преминаването към друг режим по
      подразбиране изключва обектите извън новия набор — обектите, включени
      ръчно чрез картата Entity Manager, също се премахват при смяна на
      режима, но се запазват при рестартиране със същия режим. За да
      промените това, вижте по-долу "Поведение при смяна на режима".
      "essential" е препоръчителната отправна точка.
  mode_switch_behavior:
    name: Поведение при смяна на режима
    description: >-
      Какво става с вече включените обекти при преминаване към друг режим.
      "replace" (по подразбиране) привежда включения набор точно към точките
      на новия режим — всичко, което сега е включено и не е част от новия
      режим, включително обектите, включени ръчно чрез картата Entity
      Manager, се изключва. "merge" само добавя точките на новия режим към
      вече включените — смяната на режима никога не изключва нищо. Важи при
      всяка смяна на режима. Не влияе на нова инсталация или на рестартиране
      със същия режим — задейства се само при действителна смяна на режима.
  log_level:
    name: Ниво на журнала
    description: >-
      Подробност само на журнала на добавката — не влияе на това кои обекти
      се показват. За нормална употреба се препоръчва "info". Използвайте
      "debug" за диагностика на проблеми с връзката или обектите — той
      създава голям обем изход и след това трябва да се върне на "info". За
      показване на бутона за тестовия пакет и сензора за резултат използвайте
      вместо това "Режим за отстраняване на грешки" по-долу.
  debug_mode:
    name: Режим за отстраняване на грешки
    description: >-
      Включва бутона за тестовия пакет, бутона за изчистване на динамичната
      карта и сензора за резултат в устройството Management. Независим от
      "Нивото на журнала" по-горе — това е единствената настройка, която
      определя дали тези обекти се показват. Влиза в сила при следващото
      рестартиране на добавката: изключването също премахва обектите, а не
      само спира добавянето на нови.
  api_failure_threshold:
    name: Праг на грешки в API
    description: >-
      Брой последователни неуспешни запитвания, след които в камбанката за
      известия на HA се появява постоянно известие. Стойността по
      подразбиране 3 означава три последователни грешки (90 секунди при
      интервала по подразбиране) преди предупреждение. Увеличете я в
      нестабилна мрежа, за да избегнете фалшиви аларми.
  changelog_retention_days:
    name: Съхранение на журнала с промени (дни)
    description: >-
      Колко дни се пазят записите в журнала с промени на Entity Manager,
      преди да бъдат изтрити. По-старите записи се премахват при всяко
      рестартиране на моста. Стойността по подразбиране от 90 дни е
      подходяща за повечето инсталации.
  remove_frontend:
    name: Премахване на интерфейса при спиране
    description: >-
      Задайте true преди спиране на добавката, за да се премахнат
      автоматично при следващото нормално изключване таблото Nibe Bridge,
      регистрацията на ресурса в Lovelace, файлът на картата и всички
      запазени MQTT съобщения. Използвайте само при деинсталиране.
      Обичайните рестартирания не се засягат. Пълната процедура за
      деинсталиране е описана в документацията.
  nibe_ca_cert:
    name: Път до CA сертификата на контролера Nibe
    description: >-
      Незадължително. Абсолютен път до файл с CA сертификат във формат PEM,
      използван за проверка на HTTPS сертификата на контролера Nibe. Ако е
      зададен, за всички API заявки към контролера се включва пълна проверка
      на TLS веригата и името на хоста. Оставете празно, за да се приема без
      проверка вграденият самоподписан сертификат на контролера — това е по
      подразбиране и е приемливо в надеждна домашна мрежа, но атака
      "човек по средата" в локалната мрежа би могла да прихване трафика на
      контролера.
      Пример: /ssl/nibe-ca.pem
  mqtt_tls:
    name: MQTT TLS
    description: >-
      Включва TLS криптиране за целия трафик между моста и MQTT брокера.
      Защитава данните за вход в MQTT и всички команди към обектите от
      другите устройства в локалната мрежа. Изисква брокер, настроен за TLS
      — ако използвате добавката Mosquitto, сменете "Порт на MQTT брокера" на
      8883. По подразбиране е изключено.
  mqtt_ca_cert:
    name: Път до CA сертификата на MQTT брокера
    description: >-
      Незадължително. Използва се само при включен "MQTT TLS". Абсолютен път
      до файл с CA сертификат във формат PEM, използван за проверка на TLS
      сертификата на брокера. Оставете празно, за да се използва системното
      хранилище на CA — това е вярно за брокери със сертификат, подписан от
      публичен сертифициращ орган. Задайте го, ако брокерът използва
      самоподписан или частно подписан сертификат.
      Пример: /ssl/mqtt-ca.pem
