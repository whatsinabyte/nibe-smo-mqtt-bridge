# Minimal HA configuration for the dev/e2e harness. Not used in production —
# the real add-on never touches HA's configuration.yaml.
default_config:

# Deliberately no `http:` block. It used to set `server_host: 0.0.0.0`, which
# is already Home Assistant's default, so it bought nothing — and from HA 2026
# a YAML http configuration raises the `dialog-http-pending-config` migration
# dialog, a modal that covers the frontend and silently swallows every click.
# The symptom was the first spec to click anything hanging for its whole
# timeout on "element is visible, enabled and stable" followed by
# "<dialog-http-pending-config> intercepts pointer events", which reads as a
# broken selector rather than a modal nobody asked for.

logger:
  default: warning

# The bridge's own Lovelace resource/dashboard auto-provisioning
# (nibe_lovelace.py) needs a live Supervisor WebSocket, which does not exist
# in this plain-Docker harness — it no-ops with a logged warning. Card
# resource + dashboard are seeded here instead, in YAML mode, which needs no
# API/auth round-trip and is fully reproducible from this file.
lovelace:
  mode: yaml
  resources:
    - url: /local/nibe-entity-manager-card.js
      type: module
  dashboards:
    nibe-bridge:
      mode: yaml
      filename: nibe-bridge.yaml
      title: Nibe Bridge
      icon: mdi:heat-pump
      show_in_sidebar: true
