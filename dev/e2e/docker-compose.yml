name: nibe-e2e

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "18830:1883"

  mock-nibe-api:
    build: ./mock-api
    container_name: nibe-e2e-mock-api
    environment:
      MOCK_NIBE_DUMP: /data/all_points_en.json
      MOCK_NIBE_PORT: "8443"
    volumes:
      - ../../reference-dumps/all_points_en.json:/data/all_points_en.json:ro
    ports:
      # Exposed to the host so Playwright tests (running outside Docker) can
      # reach the /mock-control/* test-only endpoints directly (value
      # changes, and withholding a point to simulate a controller restart) —
      # see mock-api/mock_nibe_api.py's module docstring. Not needed by the
      # bridge itself, which reaches this service over the compose network.
      - "18443:8443"

  homeassistant:
    image: homeassistant/home-assistant:2026.9.1
    container_name: nibe-e2e-homeassistant
    volumes:
      - ha-config:/config
      - ./ha-seed/configuration.yaml:/config/configuration.yaml:ro
      - ./ha-seed/ui-lovelace.yaml:/config/ui-lovelace.yaml:ro
      - ./ha-seed/nibe-bridge.yaml:/config/nibe-bridge.yaml:ro
    ports:
      - "18123:8123"
    depends_on:
      - mosquitto

  # One-shot: drives HA's onboarding + MQTT config-flow REST APIs headlessly.
  # Runs once per fresh `ha-config` volume and exits; safe to re-run (see
  # seed_ha.py docstring). The playwright test waits on this container's
  # exit code via `docker compose run` / healthcheck-less "depends_on"
  # ordering — see README.md for the exact invocation.
  ha-seed:
    build: ./ha-seed
    container_name: nibe-e2e-ha-seed
    environment:
      HA_URL: http://homeassistant:8123
      HA_SEED_USERNAME: admin
      HA_SEED_PASSWORD: adminpass123
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
    volumes:
      - ./seed-out:/seed-out
    depends_on:
      - homeassistant

  bridge:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: nibe-e2e-bridge
    depends_on:
      - mosquitto
      - mock-nibe-api
      - homeassistant
    volumes:
      # Which options file the bridge reads is overridable so that
      # tests/mode-switch-behavior.spec.ts can bring it up in a different
      # entity mode:
      #   BRIDGE_OPTIONS=./bridge/options-monitoring-merge.json \
      #     docker compose up -d --force-recreate bridge
      # It has to be the options file rather than the NIBE_MODE env var: the
      # add-on's own run.sh reads options.json and passes --mode on the
      # command line, and CLI flags sit above environment variables in
      # load_config's priority order, so NIBE_MODE could never take effect.
      - ${BRIDGE_OPTIONS:-./bridge/options.json}:/data/options.json:ro
      - ha-config:/homeassistant
    # No SUPERVISOR_TOKEN / Supervisor API in this harness — the bridge's
    # Lovelace resource/dashboard auto-provisioning (nibe_lovelace.py,
    # ws://supervisor/core/websocket) is Supervisor-only and no-ops cleanly
    # without it (logs a warning, does not crash). See dev/e2e/README.md
    # for how the card resource + dashboard are seeded instead (YAML-mode
    # lovelace in ha-seed/configuration.yaml). The bridge still copies the
    # card JS file itself to /homeassistant/www — that needs no Supervisor
    # token, just the shared ha-config volume mounted above.

volumes:
  ha-config:
