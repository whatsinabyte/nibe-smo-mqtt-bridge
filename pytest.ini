[pytest]
testpaths = tests
pythonpath = app
# Disposable scratch data — kept out of the add-on root so it doesn't need
# its own AppArmor write rule (root is read-only by design; /tmp already
# has one for other reasons).
cache_dir = /tmp/.pytest_cache
# Per-test timeout. Stateful Hypothesis tests (EntityManagerStatefulTest etc.)
# run 500 examples with stateful_step_count=50 and take ~3 min on ODROID-M1.
timeout = 300
