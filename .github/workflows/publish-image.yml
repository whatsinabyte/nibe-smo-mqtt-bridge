name: Build and publish add-on image

# Manual trigger only for now — the add-on is still under active local
# development and is installed via Supervisor's on-device build (see
# Dockerfile), which gives a faster local iteration loop than push-then-pull
# from a registry. config.yaml's `image:` field is commented out to match.
#
# To switch to prebuilt images once ready for real distribution:
#   1. Uncomment `image:` in config.yaml.
#   2. Either keep triggering this manually (Actions tab → Run workflow)
#      or add an automatic trigger here, e.g. `on: push: tags: ["v*"]`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (must match config.yaml's version:)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}
  ADDON_SLUG: nibe_s_series

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64/v8
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check that the version matches config.yaml
        # The Supervisor pulls the image tagged with config.yaml's version, so a
        # different tag here would publish an image nobody gets. The input goes
        # through env, not into the script text.
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          CONFIGURED=$(sed -n 's/^version:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' config.yaml)
          if [ -z "${CONFIGURED}" ] || [ "${REQUESTED}" != "${CONFIGURED}" ]; then
            echo "::error::Requested version '${REQUESTED}' does not match config.yaml's version '${CONFIGURED}'."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-addon-${{ env.ADDON_SLUG }}:${{ github.event.inputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-addon-${{ env.ADDON_SLUG }}:latest
