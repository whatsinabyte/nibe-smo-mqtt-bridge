name: Build and publish add-on image

# Manual trigger only for now — the add-on is still under active local
# development and is installed via Supervisor's on-device build (see
# Dockerfile), which gives a faster local iteration loop than push-then-pull
# from a registry. config.yaml's `image:` field is commented out to match.
#
# To switch to prebuilt images once ready for real distribution:
#   1. Uncomment `image:` in config.yaml.
#   2. Either keep triggering this manually (Actions tab → Run workflow)
#      or add an automatic trigger here, e.g. `on: push: tags: ["v*"]`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (must match config.yaml's version:)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}
  ADDON_SLUG: nibe_s_series

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64/v8
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-addon-${{ env.ADDON_SLUG }}:${{ github.event.inputs.version }}
            ${{ env.IMAGE_BASE }}/${{ matrix.arch }}-addon-${{ env.ADDON_SLUG }}:latest
